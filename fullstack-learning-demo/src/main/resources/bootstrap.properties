spring.application.name=fullstack-backend

# Nacos 服务端地址
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.file-extension=yaml

# 👈 关键解决配置：延长 gRPC 建立连接超时时间（默认 3000ms 在 Docker 仿真下容易超时）
spring.cloud.nacos.discovery.time-out=10000

# 👈 如果是在 本机/Docker 环境，显式配置客户端连接地址与重试机制
nacos.remote.client.grpc.timeout=10000