apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullstack-backend-deployment
  labels:
    app: fullstack-backend
spec:
  replicas: 2 # 2 个 Pod 副本实现高可用
  selector:
    matchLabels:
      app: fullstack-backend
  template:
    metadata:
      labels:
        app: fullstack-backend
    spec:
      containers:
        - name: fullstack-backend
          image: fullstack-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # K8s 健康检查与存活探针
          readinessProbe:
            httpGet:
              path: /api/day15/config
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/day15/config
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fullstack-backend-service
spec:
  type: NodePort
  selector:
    app: fullstack-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080